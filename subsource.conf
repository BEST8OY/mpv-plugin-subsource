# SubSource mpv Plugin Configuration
# Place this file in:
#   Linux/macOS: ~/.config/mpv/script-opts/subsource.conf
#   Windows:     %%APPDATA%/mpv/script-opts/subsource.conf

# SubSource API key. Obtain a free key at https://subsource.net/profile
# You can also set this via the environment variable SUBSOURCE_API_KEY.
api_key=

# Preferred languages separated by commas (e.g. "english", "farsi_persian,english", or "all").
# Both SubSource slugs (e.g. english, farsi_persian, spanish) and ISO-639 codes (e.g. en, fa, es, fr, de) are supported.
# Default: english
languages=english

# Subtitle sort order: popular (most downloaded), newest, rating (best rated), oldest
# Default: popular
sort=popular

# Hearing impaired filter: include, exclude, only
# Default: include
hearing_impaired=include

# Automatically download and load the top-ranked subtitle matching your language & episode
# Default: no
auto_load=no

# Automatically search SubSource when a new video is loaded
# Default: no
auto_search=no

# Filter subtitles by episode when watching a TV series
# Default: yes
episode_filter=yes

# Save downloaded subtitles to disk alongside the video file (e.g. Video.Name.en.srt)
# Default: no (kept in temporary folder)
save_to_disk=no

# Custom directory to save downloaded subtitles (optional, e.g. ~/subtitles or ~~/subtitles)
sub_dir=

# Menu UI mode: "auto" (uses uosc if detected, falls back to native OSD menu), "yes" (force uosc), "no" (native OSD)
# Default: auto
uosc=auto

# Maximum number of search results to display per query
# Default: 50
max_results=50

# Request timeout in seconds
# Default: 20
timeout=20

# Enable debug logging in mpv console / terminal
# Default: no
debug=no
